[package]
name = "oc-harness"
version = "0.1.1"
edition = "2024"
description = "A small, honest CLI coding harness"
license = "MIT"

[[bin]]
name = "d3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio = { version = "1", features = ["full"] }
tui-markdown = "0.3.12"
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.3"

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
